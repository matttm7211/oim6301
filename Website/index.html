<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A personal website for Matthew Brunton."
    >
    <title>Matthew Brunton | Home</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #172033;
        background: #f4f6fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(42rem, calc(100% - 3rem));
        padding: 3rem;
        border: 1px solid #e1e6f0;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1rem 3rem rgb(23 32 51 / 8%);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 7vw, 3.5rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: #526078;
        font-size: 1.125rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hi, I'm Matthew.</h1>
      <p>Welcome to my website. I'm just getting started—more to come soon.</p>
    </main>
  </body>
</html>
